<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de ROMs</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #121212; color: #ffffff; padding: 16px; margin: 0; }
    h2 { margin-top: 0; color: #00e676; text-align: center; }
    .rom-card { background: #1e1e1e; border: 1px solid #333; padding: 12px 16px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .rom-info h3 { margin: 0 0 4px 0; font-size: 16px; color: #fff; }
    .rom-info p { margin: 0; font-size: 12px; color: #aaa; }
    .btn-download { background: #00e676; color: #000; font-weight: bold; padding: 8px 14px; text-decoration: none; border-radius: 6px; font-size: 13px; }
    #status { text-align: center; color: #888; margin-top: 20px; }
  </style>
</head>
<body>

  <h2>Lista de ROMs</h2>
  <div id="status">Cargando catálogo...</div>
  <div id="rom-container"></div>

  <script>
    // Consume el archivo roms.json ubicado en la misma carpeta
    fetch('./roms.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('status').style.display = 'none';
        const container = document.getElementById('rom-container');
        
        data.forEach(rom => {
          const card = document.createElement('div');
          card.className = 'rom-card';
          card.innerHTML = `
            <div class="rom-info">
              <h3>${rom.name || rom.nombre || 'ROM'}</h3>
              <p>${rom.system || rom.consola || ''} ${rom.size ? '• ' + rom.size : ''}</p>
            </div>
            <a href="${rom.downloadUrl || rom.url}" class="btn-download">Descargar</a>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        document.getElementById('status').innerText = 'Error al cargar la lista JSON.';
      });
  </script>
</body>
</html>
